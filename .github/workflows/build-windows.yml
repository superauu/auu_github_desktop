name: Build Windows App (.exe)

on:
  push:
    tags: # 仅在推送 v* 标签时构建并发布新版本
      - 'v*'
  workflow_dispatch: # 允许在 GitHub Actions 控制台手动点击“Run workflow”一键编译

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    permissions:
      contents: write # 允许在发布 Tag 时自动创建 GitHub Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Check Release Versions
        run: npm run check:release

      - name: Run Regression Tests
        run: npm test

      - name: Generate App Icons
        run: npx tauri icon public/logo.svg

      - name: Build Tauri Desktop App
        run: npm run tauri -- build -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Built EXE Files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output_exe
          
          # 1. 收集 NSIS / MSI 安装包产物
          if (Test-Path "src-tauri/target/release/bundle") {
            Write-Host "Found bundle directory, copying installers..."
            Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include *.exe, *.msi | ForEach-Object {
              Write-Host "Copying installer: $($_.Name)"
              Copy-Item $_.FullName -Destination output_exe/ -Force
            }
          }

          # 2. 收集主可执行文件 (便携绿色版 .exe)
          Get-ChildItem -Path "src-tauri/target/release" -Depth 0 -Filter *.exe | Where-Object { 
            $_.Name -notmatch "build_script" 
          } | ForEach-Object {
            Write-Host "Copying standalone binary: $($_.Name)"
            Copy-Item $_.FullName -Destination output_exe/ -Force
          }

          Write-Host "`n=== Prepared Artifacts ==="
          Get-ChildItem -Path output_exe | Format-Table Name, Length, LastWriteTime

      - name: Generate Updater latest.json
        shell: powershell
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $sigFile = Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Filter "*-setup.exe.sig" | Select-Object -First 1
          if (-not $sigFile) {
            throw "No updater signature found; refusing to publish a release without automatic updates."
          }
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          $exeName = $sigFile.Name.Replace(".sig", "")
          $notesPath = Join-Path $PWD "releases/v$version.md"
          $releaseNotes = if (Test-Path -LiteralPath $notesPath) { Get-Content -LiteralPath $notesPath -Raw -Encoding UTF8 } else { "AuuGit v$version" }
          [System.IO.File]::WriteAllText((Join-Path $PWD ".release-notes.md"), $releaseNotes, [System.Text.UTF8Encoding]::new($false))
          $latest = [ordered]@{
            version = $version
            notes = $releaseNotes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/superauu/auu_github_desktop/releases/download/v$version/$exeName"
              }
            }
          }
          # Windows PowerShell's Set-Content -Encoding UTF8 adds a BOM, which JSON parsers may reject.
          $latestJson = $latest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $PWD "output_exe/latest.json"), $latestJson, [System.Text.UTF8Encoding]::new($false))
          Write-Host "latest.json written:"
          Get-Content "output_exe/latest.json"

      - name: Upload EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuuGit-Windows-x64
          path: output_exe/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_exe/*
          body_path: .release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
