name: Build Windows App (.exe)

on:
  push:
    tags: # 仅在推送 v* 标签时构建并发布新版本
      - 'v*'
  workflow_dispatch: # 允许在 GitHub Actions 控制台手动点击“Run workflow”一键编译

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    permissions:
      contents: write # 允许在发布 Tag 时自动创建 GitHub Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable（SHA 钉版后 toolchain 需显式传入）
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Check Release Versions
        run: npm run check:release

      - name: Run Regression Tests
        run: npm test

      # 与 ci.yml 同级的质量门（命令形式与缓存配置保持一致），发布构建前先过检查。
      - name: Lint Frontend
        run: npm run lint

      - name: Lint Desktop Backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Desktop Backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Generate App Icons
        run: npx tauri icon public/logo.svg

      - name: Build Tauri Desktop App
        run: npm run tauri -- build -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 崩溃上报 DSN（编译期注入；secret 未配置时客户端不创建，构建不受影响）
          AUUGIT_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_AUUGIT_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Collect Built EXE Files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output_exe
          
          # 1. 收集 NSIS / MSI 安装包产物
          if (Test-Path "src-tauri/target/release/bundle") {
            Write-Host "Found bundle directory, copying installers..."
            Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include *.exe, *.msi | ForEach-Object {
              Write-Host "Copying installer: $($_.Name)"
              Copy-Item $_.FullName -Destination output_exe/ -Force
            }
          }

          # 2. 收集主可执行文件 (便携绿色版 .exe)
          Get-ChildItem -Path "src-tauri/target/release" -Depth 0 -Filter *.exe | Where-Object { 
            $_.Name -notmatch "build_script" 
          } | ForEach-Object {
            Write-Host "Copying standalone binary: $($_.Name)"
            Copy-Item $_.FullName -Destination output_exe/ -Force
          }

          Write-Host "`n=== Prepared Artifacts ==="
          Get-ChildItem -Path output_exe | Format-Table Name, Length, LastWriteTime

      - name: Generate third-party notices
        # 构建完成后运行：cargo registry 已解压，许可文本可现场提取；产物随 output_exe/* 进 Release。
        run: node scripts/generate-notices.mjs --out output_exe/THIRD-PARTY-NOTICES-windows-x64.md

      - name: Generate Updater latest.json
        shell: powershell
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $sigFile = Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Filter "*-setup.exe.sig" | Select-Object -First 1
          if (-not $sigFile) {
            throw "No updater signature found; refusing to publish a release without automatic updates."
          }
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          $exeName = $sigFile.Name.Replace(".sig", "")
          $notesPath = Join-Path $PWD "releases/v$version.md"
          $releaseNotes = if (Test-Path -LiteralPath $notesPath) { [System.IO.File]::ReadAllText($notesPath, [System.Text.Encoding]::UTF8) } else { "AuuGit v$version" }
          [System.IO.File]::WriteAllText((Join-Path $PWD ".release-notes.md"), $releaseNotes, [System.Text.UTF8Encoding]::new($false))
          $latest = [ordered]@{
            version = $version
            notes = $releaseNotes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/superauu/auu_github_desktop/releases/download/v$version/$exeName"
              }
            }
          }
          # Windows PowerShell's Set-Content -Encoding UTF8 adds a BOM, which JSON parsers may reject.
          $latestJson = $latest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $PWD "output_exe/latest.json"), $latestJson, [System.Text.UTF8Encoding]::new($false))
          Write-Host "latest.json written:"
          Get-Content "output_exe/latest.json"

      - name: Upload EXE Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AuuGit-Windows-x64
          path: output_exe/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: output_exe/*
          body_path: .release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
