name: Build macOS & Linux

# 与 build-windows.yml 同触发（v* tag）：三个平台并行构建。Windows 作业负责创建
# GitHub Release 与 latest.json（保持既有发布流程不变）；本工作流的 attach 作业
# 轮询等待 release 出现后，把 macOS（aarch64/x86_64）与 Linux（x86_64）产物挂到
# 同一个 release 上，并经 scripts/merge-latest-manifest.mjs 把两平台的更新器签名
# 合并进 latest.json 后 --clobber 覆盖上传——macOS/Linux 用户由此收到自动更新。
# 某平台签名缺失时只跳过该平台，绝不阻塞发布（manifest 其余部分保持有效）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable（SHA 钉版后 toolchain 需显式传入）
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Check Release Versions
        run: npm run check:release

      # 平台首编：clippy/test 必须在目标平台跑（cfg 门与平台 lint 只在这里暴露）。
      - name: Lint Desktop Backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Desktop Backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Generate App Icons
        run: npx tauri icon public/logo.svg

      - name: Build Tauri Desktop App
        # --target 必须在 cargo 透传分隔符 -- 之前：否则只传给了 cargo（bundler 找不到
        # target/<triple>/release 下的主程序），Tauri CLI 自身收不到目标三元组。
        run: npm run tauri -- build --target ${{ matrix.target }} -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect macOS Artifacts
        run: |
          mkdir -p output
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          # dmg 安装包 + 更新器产物（.app.tar.gz 与签名）。
          find "$BUNDLE/dmg" -name '*.dmg' -exec cp {} output/ \; 2>/dev/null || true
          # 更新器产物按目标三元组重命名：Tauri 的 mac 归档固定叫 AuuGit.app.tar.gz，
          # 两个矩阵目标同名会让 attach 下载合并时互相覆盖、且 latest.json 无法按名识别平台。
          find "$BUNDLE/macos" -name '*.app.tar.gz' | while read -r archive; do
            base=$(basename "$archive" .app.tar.gz)
            cp "$archive" "output/${base}_${{ matrix.target }}.app.tar.gz"
            cp "$archive.sig" "output/${base}_${{ matrix.target }}.app.tar.gz.sig" 2>/dev/null || true
          done
          ls -la output
          test "$(ls output | wc -l)" -gt 0

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AuuGit-macOS-${{ matrix.target }}
          path: output/*
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable（SHA 钉版后 toolchain 需显式传入）
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Check Release Versions
        run: npm run check:release

      - name: Lint Desktop Backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Desktop Backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Generate App Icons
        run: npx tauri icon public/logo.svg

      - name: Build Tauri Desktop App
        run: npm run tauri -- build -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Linux Artifacts
        run: |
          mkdir -p output
          BUNDLE="src-tauri/target/release/bundle"
          find "$BUNDLE/appimage" -name '*.AppImage*' -exec cp {} output/ \; 2>/dev/null || true
          find "$BUNDLE/deb" -name '*.deb' -exec cp {} output/ \; 2>/dev/null || true
          find "$BUNDLE/rpm" -name '*.rpm' -exec cp {} output/ \; 2>/dev/null || true
          ls -la output
          test "$(ls output | wc -l)" -gt 0

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AuuGit-Linux-x86_64
          path: output/*
          if-no-files-found: error
          retention-days: 14

  attach-to-release:
    name: Attach Platform Artifacts to Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    # 仅 tag 触发时挂产物；手动 dispatch 只验证构建。
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download All Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Wait for Windows Release Then Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          # Windows 作业创建 release（含 latest.json）；它可能比平台作业慢，轮询等待。
          for i in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG found after $i checks"
              # 下载 Windows 上传的单平台 latest.json，把 mac/linux 签名合并进去再覆盖上传；
              # release 上暂时没有 latest.json（Windows 作业异常）时仅告警，产物照常挂载。
              if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'latest.json' --dir . --clobber; then
                node scripts/merge-latest-manifest.mjs --manifest latest.json --artifacts artifacts --tag "$TAG" --repo "$GITHUB_REPOSITORY"
                gh release upload "$TAG" artifacts/* latest.json --repo "$GITHUB_REPOSITORY" --clobber
              else
                echo "::warning::latest.json not found on release $TAG; attaching platform artifacts without manifest merge"
                gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
              fi
              exit 0
            fi
            sleep 60
          done
          echo "::error::Release $TAG did not appear within 60 minutes; platform artifacts not attached."
          exit 1
