name: Build macOS & Linux

# 与 build-windows.yml 同触发（v* tag）：三个平台并行构建。Windows 作业负责创建
# GitHub Release 与 latest.json（保持既有发布流程不变）；本工作流的 attach 作业
# 轮询等待 release 出现后，把 macOS（aarch64/x86_64）与 Linux（x86_64）产物挂到
# 同一个 release 上。latest.json 暂只含 windows-x86_64——macOS/Linux 自动更新需要
# 平台合并作业，待后续版本接入；当前两平台用户手动下载安装。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Check Release Versions
        run: npm run check:release

      # 平台首编：clippy/test 必须在目标平台跑（cfg 门与平台 lint 只在这里暴露）。
      - name: Lint Desktop Backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Desktop Backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Generate App Icons
        run: npx tauri icon public/logo.svg

      - name: Build Tauri Desktop App
        run: npm run tauri -- build -- --locked --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect macOS Artifacts
        run: |
          mkdir -p output
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          # dmg 安装包 + 更新器产物（.app.tar.gz 与签名）。
          find "$BUNDLE/dmg" -name '*.dmg' -exec cp {} output/ \; 2>/dev/null || true
          find "$BUNDLE/macos" -name '*.app.tar.gz*' -exec cp {} output/ \; 2>/dev/null || true
          ls -la output
          test "$(ls output | wc -l)" -gt 0

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuuGit-macOS-${{ matrix.target }}
          path: output/*
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Check Release Versions
        run: npm run check:release

      - name: Lint Desktop Backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Desktop Backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Generate App Icons
        run: npx tauri icon public/logo.svg

      - name: Build Tauri Desktop App
        run: npm run tauri -- build -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Linux Artifacts
        run: |
          mkdir -p output
          BUNDLE="src-tauri/target/release/bundle"
          find "$BUNDLE/appimage" -name '*.AppImage*' -exec cp {} output/ \; 2>/dev/null || true
          find "$BUNDLE/deb" -name '*.deb' -exec cp {} output/ \; 2>/dev/null || true
          find "$BUNDLE/rpm" -name '*.rpm' -exec cp {} output/ \; 2>/dev/null || true
          ls -la output
          test "$(ls output | wc -l)" -gt 0

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuuGit-Linux-x86_64
          path: output/*
          if-no-files-found: error
          retention-days: 14

  attach-to-release:
    name: Attach Platform Artifacts to Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    # 仅 tag 触发时挂产物；手动 dispatch 只验证构建。
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Wait for Windows Release Then Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          # Windows 作业创建 release（含 latest.json）；它可能比平台作业慢，轮询等待。
          for i in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG found after $i checks"
              gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            sleep 60
          done
          echo "::error::Release $TAG did not appear within 60 minutes; platform artifacts not attached."
          exit 1
