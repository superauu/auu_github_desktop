[package]
name = "auugit"
version = "0.3.15"
description = "Modern Lightweight Git Client & GitHub Dashboard"
authors = ["Auu Team"]
edition = "2021"

[lib]
name = "auu_git_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# Keep the main crate on the same minor line as the locked desktop runtime.
tauri = { version = "~2.12.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
keyring = { version = "3", features = ["windows-native"] }
# Updates use signed raw NSIS/MSI installers; ZIP support would pull withdrawn zip 4.x releases.
tauri-plugin-updater = { version = "~2.11.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.5.0"
