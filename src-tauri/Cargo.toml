[package]
name = "auugit"
version = "0.6.4"
description = "Modern Lightweight Git Client & GitHub Dashboard"
authors = ["Auu Team"]
edition = "2021"

[lib]
name = "auu_git_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# Keep the main crate on the same minor line as the locked desktop runtime.
tauri = { version = "~2.12.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
# Updates use signed raw NSIS/MSI installers; ZIP support would pull withdrawn zip 4.x releases.
tauri-plugin-updater = { version = "~2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
tempfile = "3.27"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-notification = "2.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.5.0"

[profile.release]
# 桌面 GUI 纯分发场景：thin LTO + 单 codegen 单元跨 crate 内联 + strip 符号表，
# 三平台产物体积显著缩小（预期 -20~40%）。panic 策略保持默认 unwind（GUI 依赖
# 标准库 unwind 语义的组件没有显式需求，不做 panic=abort 冒进）。
lto = "thin"
codegen-units = 1
strip = "symbols"
