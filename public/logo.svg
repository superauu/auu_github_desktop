<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- 品牌纯青渐变（userSpaceOnUse 与图标源图逐像素同源）：顶部霓虹 → 底部深青 -->
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="16" y1="12.5" x2="16" y2="35.5">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="55%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <!-- 辉光区域扩大到 220%，避免 feDropShadow 被裁切成方框 -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.1" flood-color="#22d3ee" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#090d16" />
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Git 分支图：主线（纯青渐变）+ 分支（亮青，自主线右缘起笔） -->
  <path d="M 16 12.5 L 16 35.5" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 17 22 C 24 22 28 26 32 29.5" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 32 29.5 L 32 35.75" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" />

  <!-- 节点：上节点带青色辉光 -->
  <circle cx="16" cy="16" r="5" fill="#090d16" stroke="url(#grad)" stroke-width="3" filter="url(#glow)" />
  <circle cx="16" cy="32" r="5" fill="#090d16" stroke="url(#grad)" stroke-width="3" />
  <circle cx="32" cy="34" r="4" fill="#67e8f9" />
</svg>
