<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#090d16" />
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  
  <!-- Git Graph Node Paths -->
  <path d="M 16 12 L 16 36" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 16 22 C 24 22 28 26 32 30" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 32 30 L 32 36" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Nodes -->
  <circle cx="16" cy="16" r="4.5" fill="#090d16" stroke="url(#grad)" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="16" cy="32" r="4.5" fill="#090d16" stroke="url(#grad)" stroke-width="2.5" />
  <circle cx="32" cy="34" r="3.5" fill="#06b6d4" />
</svg>
